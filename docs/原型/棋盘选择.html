<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>穿越沙漠 · 棋盘选择原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#17140f;color:#efe4c8;min-height:100vh;display:grid;place-content:center;font-family:serif}main{width:min(98vw,132vh,1250px)}svg{display:block;width:100%;border-radius:12px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:9px}button{background:#332c21;border:1px solid #69583f;color:#eee1bd;border-radius:7px;width:43px;height:37px;font:22px Georgia;cursor:pointer}button[aria-pressed=true]{background:#645039;border-color:#efd299}button svg{width:30px;height:29px;margin:auto}.edge,.shadow{fill:none;pointer-events:none;stroke-linejoin:round;stroke-linecap:round}.shadow{stroke:#352616;stroke-width:4;opacity:.8}.edge{stroke:#ffebbe;stroke-width:2}.candidate{stroke-dasharray:7 18}.aim{stroke-dasharray:42 8;animation:flow 1.3s linear infinite;stroke:#fff8dd;stroke-width:2.8}.chosen{stroke:#ffc66c;stroke-width:3;animation:settle .35s ease-out}.hit{fill:transparent;stroke:transparent;stroke-width:9;cursor:pointer}.ghost{opacity:.57;pointer-events:none}@keyframes flow{to{stroke-dashoffset:-50}}@keyframes settle{from{stroke-width:5;opacity:.5}}@media(prefers-reduced-motion:reduce){.aim,.chosen{animation:none}}
</style><main><svg id="board" viewBox="0 0 930 620" aria-label="穿越沙漠棋盘"><image href="../../Unity/Catan/Assets/Resources/AcceptedMenu/map-穿越沙漠.png" width="930" height="620"/><g id="pieces"></g><g id="marks"></g></svg><nav id="bar" aria-label="演示场景"></nav></main><script>
const shapes=['M0 -48 61 -23 61 24 0 49 -61 24 -61 -23Z','M-13 -12 Q-15 -12 -15 -8 V10 Q-15 13 -11 13 H12 Q15 13 15 10 V-9 Q15 -12 12 -12Z','M-25 6 21 -13 25 -8 -21 12Z','M-20 4 -4 6 -4 -14 -1 -19 12 0 1 -2 1 6 21 0 15 11 -9 15Z','M-16 12 -16 -3 -19 -3 -6 -17 7 -8 16 -10 19 6 7 15Z','M-12 13 -8 5 -6 -3 -13 -2 -10 -11 -3 -17 4 -13 9 -4 8 4 14 12Z','M-12 13 -7 2 -5 -5 Q-12 -16 0 -18 Q12 -16 5 -5 L8 2 13 13Z','M-22 4 -5 6 -5 -17 12 -12 9 -3 -2 -6 -2 6 21 0 14 13 -9 15Z','M0 -10 11 -3 10 6 0 11 -10 6 -11 -3Z','M-26 8 21 -12 25 -7 -22 13Z'];
const names=['地块','点数','道路','船','建筑','骑士','强盗','海盗','建造落点','移动落点'];
const positions=[[[525,162],[397,321],[329,397]],[[201,91],[783,170],[459,248]],[[235,210],[489,367],[101,361]],[[657,304],[574,398],[780,470]],[[264,222],[461,360],[129,364]],[[399,216],[532,354],[266,430]],[[329,90]],[[650,166]],[[465,208],[329,351],[198,428]],[[714,294],[594,445],[855,427]]];
const colors=['','#f5deac','#aa5430','#895632','#ab5835','#65756c','#423d36','#584636'];
const detail=['','','M-20 7 20 -10','M-17 7 -2 10 15 5 M-1 -14 7 -2','M-15 -3 -5 -13 5 -4 5 11 M5 -4 15 -8','M-9 -6 -3 -12 2 -9 M-7 7 8 7','M-5 4 5 4','M-17 7 -2 10 15 5'];
const nums=[5,8,6],ns='http://www.w3.org/2000/svg';const board=document.querySelector('#board'),bar=document.querySelector('#bar'),pieces=document.querySelector('#pieces'),marks=document.querySelector('#marks');let mode=0,aim=-1,picks=[],auto=true,step=0,source=0,phase='source';
function path(d,cls){return '<path d="'+d+'" class="'+cls+'"/>'}
function art(k,i){return '<path d="'+shapes[k]+'" fill="'+colors[k]+'" stroke="#38261a" stroke-width="1.7"/>'+(detail[k]?'<path d="'+detail[k]+'" stroke="#dec28b" fill="none"/>':'')+(k===1?'<text y="7" text-anchor="middle" fill="#633e24" font-family="Georgia" font-size="21">'+nums[i]+'</text>':'')}
function group(p,body){return '<g transform="translate('+p.join(' ')+')">'+body+'</g>'}
function targetKind(){if(phase==='land'&&(mode===6||mode===7))return 0;return mode===9&&phase==='source'?3:mode}
function locations(k){if(mode===7&&phase==='land')return [[650,166],[791,317],[658,480]];return positions[k]}
function draw(){let scenery='',overlay='';for(let k=1;k<=7;k++)positions[k].forEach((p,i)=>{if(phase==='land'&&picks.length&&((mode===9&&k===3&&i===source)||((mode===6||mode===7)&&k===mode)))return;scenery+=group(p,art(k,i))});let k=targetKind();locations(k).forEach((p,i)=>{let selected=picks.includes(i),state=selected?'chosen':aim===i?'aim':'candidate';let movingToken=(mode===6||mode===7)&&phase==='land';let ghost=(k>=8||movingToken)&&(selected||aim===i)?'<g class="'+(selected?'':'ghost')+'">'+art(movingToken?mode:k===8?4:3,0)+'</g>':'';overlay+=group(p,ghost+path(shapes[k],'shadow '+state)+path(shapes[k],'edge '+state)+'<path class="hit" data-i="'+i+'" d="'+shapes[k]+'"/>')});if(mode===9&&phase==='land'&&!picks.length)overlay+=group(positions[3][source],path(shapes[3],'edge chosen'));pieces.innerHTML=scenery;marks.innerHTML=overlay;Array.from(bar.children).forEach((b,i)=>b.setAttribute('aria-pressed',i===10?auto:i===mode));bar.lastChild.textContent=auto?'Ⅱ':'▷'}
function reset(k){mode=k;aim=-1;picks=[];phase='source';step=0;draw()}
function select(i){if([6,7,9].includes(mode)&&phase==='source'){source=i;phase='land';aim=-1;picks=[]}else if([6,7,9].includes(mode)&&picks.length){reset(mode);return}else if(mode<=1){picks=picks.includes(i)?picks.filter(v=>v!==i):[...picks.slice(-1),i]}else picks=[i];draw()}
names.concat('自动轮播').forEach((n,i)=>{let b=document.createElement('button');b.title=n;b.setAttribute('aria-label',n);if(i<10)b.innerHTML='<svg viewBox="-30 -23 60 46"><path transform="scale('+(i===0?.41:1)+')" d="'+shapes[i]+'" fill="none" stroke="currentColor" stroke-width="'+(i===0?5:2.6)+'"/></svg>';b.onclick=()=>{if(i===10){auto=!auto;reset(mode)}else{auto=false;reset(i)}};bar.append(b)});
board.onpointermove=e=>{if(auto)return;let i=e.target.dataset.i;let next=i===undefined?-1:+i;if(next!==aim){aim=next;draw()}};board.onclick=e=>{let i=e.target.dataset.i;if(i!==undefined){auto=false;select(+i)}};reset(0);
setInterval(()=>{if(!auto)return;step++;if(step===1)aim=0;else if(step===2)select(0);else if(step===3&&(mode<2||[6,7,9].includes(mode)))aim=1;else if(step===4&&(mode<2||[6,7,9].includes(mode)))select(1);else if(step>=5||(step===3&&mode>=2&&![6,7,9].includes(mode)))reset((mode+1)%10);draw()},1000);
</script></html>
